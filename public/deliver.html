<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f100e" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>iPay · Submit your work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/base.css">
  <style>
    .dl { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .dl-card { width: min(560px, 100%); background: var(--card); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: clamp(22px, 5vw, 40px); box-shadow: var(--shadow); }
    .dl-from { margin: 26px 0 6px; font: 400 12px/1 var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
    .dl h1 { margin: 0 0 14px; font: 400 clamp(30px, 6vw, 40px)/1.05 var(--serif); letter-spacing: -.015em; }
    .dl-meta { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px; border-radius: var(--r); background: var(--paper-2); margin-bottom: 20px; font-size: 14px; }
    .dl-amt { font: 500 22px/1 var(--mono); align-self: center; grid-row: span 2; }
    .dl-meta small { color: var(--ink-3); }
    .dl-scope { margin: 0 0 22px; font-size: 14px; color: var(--ink-2); white-space: pre-wrap; }
    .dl-scope b { display: block; font-weight: 500; color: var(--ink-3); font-size: 12px; margin-bottom: 4px; }
    form { display: grid; gap: 16px; }
    .form-error { margin: 0; padding: 10px 12px; border-radius: var(--r-sm); background: var(--red-soft); color: var(--red); font-size: 13px; }
    form .btn { width: 100%; }
    .result { display: grid; gap: 14px; text-align: left; }
    .result-badge { display: inline-flex; align-items: center; gap: 8px; width: fit-content; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--paper-2); color: var(--ink-2); }
    .result-badge.ok { background: var(--accent-soft); color: var(--accent); }
    .result-badge.warn { background: var(--amber-soft); color: var(--amber); }
    .result-badge.busy::before { content: ''; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result p { margin: 0; color: var(--ink-2); }
    .result a { color: var(--ink); border-bottom: 1px solid var(--rule); }
    .dl-foot { margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--rule-2); font-size: 12px; color: var(--ink-3); text-align: center; }
  </style>
</head>
<body>
  <main class="dl">
    <div class="dl-card">
      <a class="wordmark" href="/" aria-label="iPay home">
        <svg class="emblem" viewBox="0 0 32 32" aria-hidden="true"><polygon class="e-ink" points="6.5,5.5 22.5,5.5 26.5,9.5 10.5,9.5"/><polygon class="e-acc" points="26.5,6.5 26.5,22.5 22.5,26.5 22.5,10.5"/><polygon class="e-ink" points="25.5,26.5 9.5,26.5 5.5,22.5 21.5,22.5"/><polygon class="e-acc" points="5.5,25.5 5.5,9.5 9.5,5.5 9.5,21.5"/><polygon class="e-ink" points="16,11.5 20.5,16 16,20.5 11.5,16"/><circle class="e-acc" cx="16" cy="16" r="1.6"/></svg>
        <span>iPay</span>
      </a>
      <div id="loading"><p class="dl-from">Loading your milestone…</p></div>
      <div id="invalid" hidden>
        <h1 style="margin-top:26px">This link isn't valid</h1>
        <p class="muted">Ask the business that hired you to send the delivery link again.</p>
      </div>
      <div id="content" hidden>
        <p class="dl-from" id="from"></p>
        <h1 id="title"></h1>
        <div class="dl-meta"><strong id="contractor"></strong><span class="dl-amt" id="amount"></span><small id="due"></small></div>
        <p class="dl-scope" id="scope" hidden><b>What was agreed</b><span></span></p>

        <form id="deliver-form" novalidate>
          <label class="field">What did you deliver?
            <textarea class="input" name="note" rows="5" required minlength="10" maxlength="2000" placeholder="Shipped the checkout redesign: new cart, payment step and confirmation screens. All acceptance items from the brief are done."></textarea>
          </label>
          <label class="field">Link to the work <span class="hint">optional, but it helps it get paid faster</span>
            <input class="input" name="link" type="url" inputmode="url" placeholder="https://">
          </label>
          <p class="form-error" data-error hidden></p>
          <button class="btn btn-ink btn-lg" type="submit">Submit for payment</button>
        </form>

        <div class="result" id="result" hidden>
          <span class="result-badge" id="result-badge"></span>
          <p id="result-text"></p>
        </div>
      </div>
      <p class="dl-foot">The business's payments agent reviews your delivery against what was agreed. Approved work is paid in USDC to your wallet.</p>
    </div>
  </main>
  <script type="module" src="/deliver.js"></script>
</body>
</html>
